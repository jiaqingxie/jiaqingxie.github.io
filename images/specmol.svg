    <path d="M12 56 L26 56 L29 31 L32 56 L48 56 L51 40 L54 56 L76 56 L79 25 L82 56 L102 56 L105 44 L108 56 L130 56 L133 36 L136 56 L142 56" fill="none" stroke="#111111" stroke-width="1.4"/>
