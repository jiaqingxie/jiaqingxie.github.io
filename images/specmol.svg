      <line x1="44" y1="57" x2="44" y2="32"/>
      <line x1="64" y1="57" x2="64" y2="50"/>
      <line x1="86" y1="57" x2="86" y2="27"/>
      <line x1="108" y1="57" x2="108" y2="40"/>
      <line x1="130" y1="57" x2="130" y2="35"/>
    </g>
    <line x1="12" y1="57" x2="142" y2="57" stroke="#555555" stroke-width="0.9"/>
  </g>

  <!-- Arrows -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000"/>
    </marker>
  </defs>
  <g stroke="#000000" stroke-width="1.15" fill="none" marker-end="url(#arr)">
