    <path d="M12 34 C24 34 28 55 36 55 C44 55 46 36 58 36 C70 36 74 58 84 58 C92 58 96 35 110 35 C120 35 124 49 132 49 C137 49 139 36 142 36" fill="none" stroke="#111111" stroke-width="1.4"/>
