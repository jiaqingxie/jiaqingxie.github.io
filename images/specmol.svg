  <!-- Center box: TikZ double border -->
  <rect x="230" y="126" width="140" height="140" fill="#f7f7f7" stroke="#000000" stroke-width="1.6"/>
  <rect x="234" y="130" width="132" height="132" fill="none" stroke="#000000" stroke-width="0.6"/>
  <text x="300" y="168" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#000000">SpecMol</text>
  <line x1="252" y1="178" x2="348" y2="178" stroke="#000000" stroke-width="0.7"/>
  <text x="300" y="199" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#222222">Numerically Faithful</text>
  <text x="300" y="216" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#222222">Spectral Serialization</text>
  <text x="300" y="246" text-anchor="middle" font-family="monospace" font-size="11" fill="#880000">SpecMol-Bench</text>

