  <line x1="56" y1="344" x2="544" y2="344" stroke="#cccccc" stroke-width="0.8"/>
  <text x="300" y="366" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#333333">Unified multi-modal foundation model · JCIM (Provisionally Accepted)</text>
